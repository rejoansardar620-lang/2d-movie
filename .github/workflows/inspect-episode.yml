name: Inspect and build original 2D episode
on:
  push:
    branches: ["work/next-two-minute-episode"]
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect original project archive and runtime
        shell: bash
        run: |
          set -euo pipefail
          echo '=== ARCHIVE INVENTORY ==='
          unzip -l "Everyday_English_2_Minute_Project (1).zip" | head -130
          mkdir -p /tmp/original-project
          unzip -q "Everyday_English_2_Minute_Project (1).zip" -d /tmp/original-project
          echo '=== FILES ==='
          find /tmp/original-project -maxdepth 5 -type f -printf '%p (%s bytes)\n' | head -150
          echo '=== TEXT FILES (up to 300 lines per file) ==='
          find /tmp/original-project -type f \( -name '*.py' -o -name '*.json' -o -name '*.md' -o -name '*.sh' -o -name '*.txt' -o -name '*.yml' \) -size -100k -print0 | while IFS= read -r -d '' f; do
            echo "===== $f ====="
            head -300 "$f"
          done
          echo '=== ORIGINAL VIDEO STREAM DATA ==='
          ffprobe -v error -show_entries format=duration,size -show_entries stream=width,height,r_frame_rate,codec_name -of json "Everyday_English_2_Minute_Preview (2).mp4"
